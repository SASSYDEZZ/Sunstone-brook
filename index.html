<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>The Vane Grand Hotel</title>
    <style>
      /* Self-hosted Brand Bible typefaces — no external CDN (CSP-safe).
         Cinzel SemiBold for headings/signage, Lora for body copy. */
      @font-face {
        font-family: 'Cinzel';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/cinzel-600-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Lora';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/lora-400-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Lora';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/lora-400-italic-latin.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a2232;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        box-shadow: 0 0 60px rgba(199, 163, 90, 0.15);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
